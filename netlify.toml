[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /copy-of-free-processing was a Wix page with ranking history. The page is
# retired but the URL must not 404 — a 301 hands its history to /sign-up.
[[redirects]]
  from = "/copy-of-free-processing"
  to = "/sign-up"
  status = 301
  force = true

# Partner links. Someone arriving from Palm Tree Pay Tech uses epaypos.net/pt;
# it lands on the ordinary homepage carrying the tag, which the site stores for
# 30 days and the forms read on submit.
# 302, not 301: the destination is an attribution mechanism, not a permanent
# home for that URL, and browsers cache a 301 forever.
[[redirects]]
  from = "/pt"
  to = "/?partner=palm-tree-pay-tech"
  status = 302
  force = true

# The original, longer path. Kept so any link already handed out still works —
# it costs one rule and a dead partner link costs a lead. Safe to delete once
# you are sure /palm-tree-pay-tech was never sent to anyone.
[[redirects]]
  from = "/palm-tree-pay-tech"
  to = "/?partner=palm-tree-pay-tech"
  status = 302
  force = true
